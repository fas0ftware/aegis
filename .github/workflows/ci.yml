name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pyflakes aegis tests
      - run: python -m pytest -q
      - name: Demo and a real run on the CI machine (read-only)
        run: |
          python -m aegis --demo check --json | python -c "import json,sys; d=json.load(sys.stdin); assert d['counts']['fail'] == 3"
          python -m aegis check --no-fixes
          python -m aegis --demo report demo.html && grep -q "Aegis report" demo.html

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install bandit
      - name: Static analysis (bandit)
        run: bandit -q -r aegis
