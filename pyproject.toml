[project]
name = "aegis"
version = "0.1.0"
description = "Read-only security check for a Linux laptop, with the why and the fix for every finding"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aegis = "aegis.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aegis"]
